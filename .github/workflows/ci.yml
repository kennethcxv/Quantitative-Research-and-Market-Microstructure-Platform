name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      # The synthetic end-to-end demo from a clean checkout: generate, import, validate,
      # experiment with negative controls, report. Fails if any control fails to run.
      - run: scripts/demo.sh
      - run: test "$(jq '[.[] | select(.passed | not)] | length' runs/synthetic_imbalance/*/controls.json)" = 0
